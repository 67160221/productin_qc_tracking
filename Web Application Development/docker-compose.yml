version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: webapp_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: webapp_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: webapp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webapp_tunnel
    restart: always
    command: tunnel --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data: