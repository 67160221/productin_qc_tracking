<title id="t">TRACK-PRO technology stack diagram</title>
<desc id="d">Layered technology stack: HTML5, Tailwind CSS and JavaScript on the client; Nginx as gateway; Python, FastAPI, Uvicorn, Pydantic and SQLAlchemy on the backend; PostgreSQL for data; Docker, Docker Compose and Cloudflare Tunnel for infrastructure.</desc>
