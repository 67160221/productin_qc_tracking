<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - QC & Production Tracking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Main Card Container -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
            
            <!-- Logo & Title -->
            <div class="text-center space-y-2">
                <div class="inline-block bg-orange-500/10 text-orange-400 p-3 rounded-full text-3xl mb-1">
                    🏭
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-orange-400">⚡ TRACK-PRO</h1>
                <p class="text-xs text-gray-400">ระบบติดตามสถานะการผลิตและควบคุมคุณภาพ Real-time</p>
            </div>

            <!-- Form -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                
                <!-- Role Selection Toggle -->
                <div>
                    <label class="text-xs font-semibold text-gray-400 block mb-2 uppercase tracking-wider">เลือกบทบาทผู้ใช้งาน (User Role)</label>
                    <div class="grid grid-cols-2 gap-2 bg-gray-950 p-1 rounded-lg border border-gray-800">
                        <button type="button" id="roleClient" onclick="setRole('client')" class="bg-orange-500 text-gray-950 font-bold py-2 px-3 rounded-md text-xs transition">
                            🤝 ลูกค้า / ผู้จัดซื้อ
                        </button>
                        <button type="button" id="roleManager" onclick="setRole('manager')" class="text-gray-400 font-medium py-2 px-3 rounded-md text-xs transition hover:text-white">
                            ⚙️ ผู้จัดการโรงงาน
                        </button>
                    </div>
                </div>

                <!-- Username / Email -->
                <div>
                    <label for="username" class="text-xs font-semibold text-gray-400 block mb-1.5">ชื่อผู้ใช้ หรือ อีเมล</label>
                    <input type="text" id="username" required placeholder="เช่น info@company.com" 
                           class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-orange-500 transition">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="text-xs font-semibold text-gray-400">รหัสผ่าน</label>
                        <a href="#" onclick="alert('กรุณาติดต่อเจ้าหน้าที่ดูแลระบบ (Admin) ประจำโรงงานเพื่อรีเซ็ตรหัสผ่าน')" class="text-[11px] text-gray-500 hover:text-orange-400 transition">ลืมรหัสผ่าน?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-orange-500 transition">
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-gray-950 border-gray-700 text-orange-500 focus:ring-0 focus:ring-offset-0 cursor-pointer">
                    <label for="remember" class="text-xs text-gray-400 select-none cursor-pointer">จดจำการเข้าสู่ระบบบนอุปกรณ์นี้</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-gray-950 font-bold py-3 rounded-lg text-sm hover:from-orange-400 hover:to-amber-400 transition shadow-lg shadow-orange-500/10 mt-2">
                    เข้าสู่ระบบด้วยระบบรักษาความปลอดภัย 🔒
                </button>
            </form>

            <!-- Footer Note inside Card -->
            <div class="text-center text-[11px] text-gray-600 pt-2 border-t border-gray-700/50">
                ระบบเชื่อมต่อมาตรฐานความปลอดภัยข้อมูลโรงงานและ IoT Cloud
            </div>
        </div>
    </div>

    <!-- Bottom Footer -->
    <footer class="text-center py-4 text-[11px] text-gray-600 border-t border-gray-800/40 bg-gray-950/40">
        &copy; 2026 TRACK-PRO Systems. All Rights Reserved.
    </footer>

    <!-- JavaScript Handling Interactivity -->
    <script>
        let currentRole = 'client';

        function setRole(role) {
            currentRole = role;
            const btnClient = document.getElementById('roleClient');
            const btnManager = document.getElementById('roleManager');

            if (role === 'client') {
                btnClient.className = "bg-orange-500 text-gray-950 font-bold py-2 px-3 rounded-md text-xs transition";
                btnManager.className = "text-gray-400 font-medium py-2 px-3 rounded-md text-xs transition hover:text-white";
            } else {
                btnManager.className = "bg-orange-500 text-gray-950 font-bold py-2 px-3 rounded-md text-xs transition";
                btnClient.className = "text-gray-400 font-medium py-2 px-3 rounded-md text-xs transition hover:text-white";
            }
        }

        function handleLogin(event) {
            event.preventDefault(); // ป้องกันการรีเฟรชหน้าจอคอมพิวเตอร์
            
            // จำลองการโหลดและลิงก์เชื่อมโยงไปยังหน้าแดชบอร์ดหลัก (index.html)
            alert(`🔓 ยินดีต้อนรับ! เข้าสู่ระบบสำเร็จในฐานะ [${currentRole === 'client' ? 'ลูกค้า/ผู้จัดซื้อ' : 'ผู้จัดการโรงงาน'}] กำลังพาคุณไปยังแดชบอร์ดติดตามงานแบบเรียลไทม์`);
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
