<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 660" width="1210" height="660" font-family="'Sarabun','Noto Sans Thai','Tahoma','Garuda','Loma',sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">TRACK-PRO current architecture</title>
<desc id="d">Users reach an Nginx frontend container, which proxies /api to a FastAPI backend container backed by a PostgreSQL container, all in one Docker Compose network.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1210" height="660" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start">TRACK-PRO — Current Architecture (as-is)</text>
<text x="40" y="70" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">สถาปัตยกรรมที่รันอยู่จริงตาม docker-compose.yml: 4 containers ใน Docker Compose network เดียว</text>
<rect x="250" y="100" width="920" height="530" rx="16" fill="#FCFAFE" stroke="#6A3EA1" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="268" y="126" font-size="13" font-weight="700" fill="#6A3EA1" text-anchor="start">Docker Compose network</text>
<rect x="40" y="250" width="170" height="128" rx="12" fill="#EEF2F7" stroke="#64748B" stroke-width="1.6"/>
<text x="56" y="276" font-size="15" font-weight="700" fill="#64748B" text-anchor="start">Users</text>
<text x="56" y="295" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Web Browser</text>
<text x="56" y="321" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Client / Procurement</text>
<text x="56" y="339" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Factory Manager</text>
<rect x="280" y="150" width="230" height="310" rx="12" fill="#E8F3EA" stroke="#2E7D32" stroke-width="1.6"/>
<text x="296" y="176" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="start">frontend</text>
<text x="296" y="195" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Nginx (alpine) · :80 </text>
<text x="296" y="227" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Static files</text>
<text x="296" y="247" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• login.html</text>
<text x="296" y="267" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• dashboard.html</text>
<text x="296" y="287" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• tracking.html</text>
<text x="296" y="307" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• qc-report.html</text>
<text x="296" y="331" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Reverse proxy</text>
<text x="296" y="351" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• /api/*  →  backend:8000/</text>
<rect x="590" y="150" width="250" height="310" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="606" y="176" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">backend</text>
<text x="606" y="195" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">FastAPI + Uvicorn · :8000 (internal)</text>
<text x="606" y="226" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Modules / Endpoints</text>
<text x="606" y="245" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Auth  /v1/auth/login, register</text>
<text x="606" y="264" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Jobs &amp; Dashboard  /v1/jobs</text>
<text x="606" y="283" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Edge-case / Concession</text>
<text x="606" y="302" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Post-Processing</text>
<text x="606" y="321" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• QC Report</text>
<text x="606" y="340" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Logistics</text>
<text x="606" y="359" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Health  /v1/health</text>
<text x="606" y="382" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Startup</text>
<text x="606" y="401" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• wait DB → create tables → seed</text>
<rect x="920" y="150" width="220" height="310" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6"/>
<text x="936" y="176" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">db</text>
<text x="936" y="195" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15 (alpine) · :5432</text>
<text x="936" y="226" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Tables</text>
<text x="936" y="245" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• users</text>
<text x="936" y="264" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• job_orders</text>
<text x="936" y="283" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• post_processing_steps</text>
<text x="936" y="302" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• qc_reports</text>
<text x="936" y="321" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• qc_report_items</text>
<text x="936" y="340" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• logistics</text>
<text x="936" y="363" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Volume</text>
<text x="936" y="382" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• postgres_data (persistent)</text>
<rect x="280" y="500" width="230" height="100" rx="12" fill="#EFE7F6" stroke="#6A3EA1" stroke-width="1.6"/>
<text x="296" y="526" font-size="15" font-weight="700" fill="#6A3EA1" text-anchor="start">cloudflared</text>
<text x="296" y="545" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Cloudflare Tunnel</text>
<text x="296" y="571" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• forward → frontend:80</text>
<path d="M 210 300 L 280 300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="245" y="270" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">HTTP :80</text>
<text x="245" y="283" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(localhost)</text>
<path d="M 125 378 L 125 550 L 280 550" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="132" y="540" font-size="11" font-weight="600" fill="#475569" text-anchor="start">HTTPS (public URL)</text>
<path d="M 395 500 L 395 460" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 510 300 L 590 300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="550" y="282" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">/api/*</text>
<text x="550" y="295" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">proxy</text>
<path d="M 840 300 L 920 300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="880" y="282" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">SQL</text>
<text x="880" y="295" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(psycopg2)</text>
<text x="590" y="490" font-size="11.5" font-weight="600" fill="#5B6472" text-anchor="start">backend และ db ไม่เปิดพอร์ตออกภายนอก</text>
<text x="590" y="508" font-size="11.5" font-weight="400" fill="#5B6472" text-anchor="start">เข้าถึงได้เฉพาะภายใน network ผ่านชื่อ service</text>
<text x="590" y="538" font-size="11.5" font-weight="400" fill="#5B6472" text-anchor="start">ข้อมูลเริ่มต้น: seed.py ทำงานอัตโนมัติตอน backend เริ่ม</text>
<text x="590" y="556" font-size="11.5" font-weight="400" fill="#5B6472" text-anchor="start">(users 2 บัญชี + Job Order Z-2046 พร้อม QC / Logistics)</text>
</svg>
