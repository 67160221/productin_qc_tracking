<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 830" width="1170" height="830" font-family="'Sarabun','Noto Sans Thai','Tahoma','Garuda','Loma',sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">TRACK-PRO target microservices architecture</title>
<desc id="d">An API gateway routes to five services (auth, job and dashboard, post-processing, QC, logistics), each with its own database; an IoT gateway is planned.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1170" height="830" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start">TRACK-PRO — Microservices Architecture (target)</text>
<text x="40" y="70" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">แยก FastAPI backend ตัวเดียวในปัจจุบัน ออกเป็น 5 services ตามขอบเขต endpoint (1 service = 1 container, 1 database)</text>
<rect x="40" y="96" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
<rect x="54" y="108" width="26" height="14" rx="3" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="90" y="120" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">มี endpoint แล้วในโค้ดปัจจุบัน</text>
<rect x="54" y="134" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="90" y="146" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">แผนพัฒนา / ยังไม่แยกหรือยังไม่มีในโค้ด</text>
<rect x="430" y="96" width="300" height="70" rx="12" fill="#EEF2F7" stroke="#64748B" stroke-width="1.6"/>
<text x="446" y="122" font-size="15" font-weight="700" fill="#64748B" text-anchor="start">Web Browser</text>
<text x="446" y="141" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Customer / Factory Manager</text>
<rect x="830" y="96" width="300" height="70" rx="12" fill="#EEF2F7" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="846" y="122" font-size="15" font-weight="700" fill="#64748B" text-anchor="start">IoT Gateway (planned)</text>
<text x="846" y="141" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">shot count / machine status</text>
<rect x="40" y="220" width="1090" height="74" rx="12" fill="#E8F3EA" stroke="#2E7D32" stroke-width="1.6"/>
<text x="56" y="246" font-size="15" font-weight="700" fill="#2E7D32" text-anchor="start">API Gateway — Nginx</text>
<text x="56" y="265" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Static Web UI  ·  Routing /api/v1/*  ·  (planned: token verification, rate limit)</text>
<path d="M 580 166 L 580 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 980 166 L 980 220" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<rect x="40" y="350" width="208" height="160" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="56" y="376" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">Auth Service</text>
<text x="56" y="403" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• POST /v1/auth/login</text>
<text x="56" y="422" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• POST /v1/auth/register</text>
<text x="56" y="445" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">Users &amp; roles</text>
<text x="56" y="464" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• client · manager</text>
<text x="74" y="326" font-size="10" font-weight="600" fill="#2F5FBF" text-anchor="start">/api/v1/auth/*</text>
<path d="M 60 294 L 60 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="260" y="350" width="208" height="160" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="276" y="376" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">Job &amp; Dashboard</text>
<text x="276" y="403" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• GET  /jobs/{id}/dashboard</text>
<text x="276" y="422" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• POST /jobs/{id}/edge-case</text>
<text x="276" y="441" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• POST /jobs/{id}/concession</text>
<text x="276" y="460" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• POST /jobs</text>
<text x="294" y="326" font-size="10" font-weight="600" fill="#2F5FBF" text-anchor="start">/api/v1/jobs/*</text>
<path d="M 280 294 L 280 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="480" y="350" width="208" height="160" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="496" y="376" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">Post-Processing</text>
<text x="496" y="403" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• GET  /jobs/{id}/post-processing</text>
<text x="496" y="426" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">4 ขั้นตอน</text>
<text x="496" y="445" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Casting → CNC → CMM/X-Ray</text>
<text x="496" y="464" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• → Coating</text>
<text x="514" y="326" font-size="10" font-weight="600" fill="#2F5FBF" text-anchor="start">/api/v1/jobs/{id}/post-processing</text>
<path d="M 500 294 L 500 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="700" y="350" width="208" height="160" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="716" y="376" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">QC Service</text>
<text x="716" y="403" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• GET  /jobs/{id}/qc-report</text>
<text x="716" y="426" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">ผลตรวจคุณภาพ</text>
<text x="716" y="445" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• spec / actual / PASS-FAIL</text>
<text x="716" y="464" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• sampling MIL-STD-105E</text>
<text x="734" y="326" font-size="10" font-weight="600" fill="#2F5FBF" text-anchor="start">/api/v1/jobs/{id}/qc-report</text>
<path d="M 720 294 L 720 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="920" y="350" width="208" height="160" rx="12" fill="#E6EEFB" stroke="#2F5FBF" stroke-width="1.6"/>
<text x="936" y="376" font-size="15" font-weight="700" fill="#2F5FBF" text-anchor="start">Logistics Service</text>
<text x="936" y="403" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• GET  /jobs/{id}/logistics</text>
<text x="936" y="426" font-size="11.5" font-weight="700" fill="#5B6472" text-anchor="start">การจัดส่ง</text>
<text x="936" y="445" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• delivery note · vehicle</text>
<text x="936" y="464" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• driver status · GPS link</text>
<text x="954" y="326" font-size="10" font-weight="600" fill="#2F5FBF" text-anchor="start">/api/v1/jobs/{id}/logistics</text>
<path d="M 940 294 L 940 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40" y="580" width="208" height="96" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="56" y="606" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">users_db</text>
<text x="56" y="625" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15</text>
<text x="56" y="650" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• users</text>
<path d="M 60 510 L 60 580" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="260" y="580" width="208" height="96" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="276" y="606" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">jobs_db</text>
<text x="276" y="625" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15</text>
<text x="276" y="650" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• job_orders</text>
<path d="M 280 510 L 280 580" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="480" y="580" width="208" height="96" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="496" y="606" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">tracking_db</text>
<text x="496" y="625" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15</text>
<text x="496" y="650" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• post_processing_steps</text>
<path d="M 500 510 L 500 580" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="700" y="580" width="208" height="96" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="716" y="606" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">qc_db</text>
<text x="716" y="625" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15</text>
<text x="716" y="650" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• qc_reports</text>
<text x="716" y="667" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• qc_report_items</text>
<path d="M 720 510 L 720 580" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="920" y="580" width="208" height="96" rx="12" fill="#FBF1DC" stroke="#95700F" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="936" y="606" font-size="15" font-weight="700" fill="#95700F" text-anchor="start">logistics_db</text>
<text x="936" y="625" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">PostgreSQL 15</text>
<text x="936" y="650" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• logistics</text>
<path d="M 940 510 L 940 580" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="40" y="704" font-size="11.5" font-weight="600" fill="#5B6472" text-anchor="start">หมายเหตุ: ปัจจุบันทั้ง 5 services อยู่รวมเป็น module ใน backend container เดียว (modular monolith)</text>
<text x="40" y="723" font-size="11.5" font-weight="600" fill="#95700F" text-anchor="start">Database per service เป็นแผนพัฒนา — ปัจจุบันทุกตารางอยู่ใน PostgreSQL database เดียว</text>
<rect x="40" y="744" width="1090" height="62" rx="12" fill="#EFE7F6" stroke="#6A3EA1" stroke-width="1.6"/>
<text x="56" y="770" font-size="15" font-weight="700" fill="#6A3EA1" text-anchor="start">Docker Compose</text>
<text x="56" y="789" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">1 service = 1 container  ·  .env configuration  ·  cloudflared tunnel → gateway</text>
</svg>
